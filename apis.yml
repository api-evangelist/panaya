aid: panaya
name: Panaya
description: >-
  Panaya is an enterprise change-intelligence and agentic-testing platform for
  business applications, helping organizations de-risk changes to SAP (including
  S/4HANA migrations and upgrades), Oracle (EBS, Cloud, NetSuite), Salesforce,
  Workday, ServiceNow and SuccessFactors. Its platform combines change impact
  analysis, test management and AI-driven test automation, with an agentic layer
  ("Seemore") that analyzes changes, generates and fixes tests, and guides teams.
  Panaya exposes a REST API (the Test Dynamix APIs plus code/patch upload and
  mass-export endpoints) with token-based authentication, documented rate limits,
  outbound webhooks via its Automation Rules Center, and integrations with Jira,
  SAP ChaRM and SAP Cloud ALM. Panaya is owned by Infosys and was previously
  backed by Battery Ventures.
