apis:
- name: Panaya API
  description: >-
    Panaya's REST API surface, including the Test Dynamix APIs (Transaction,
    Cycles, Folder, Business Process, Test, Test Step, Step Run, Defect,
    Requirements — each supporting get-all/get/create/update), mass-export APIs,
    custom-code / patch upload APIs, and project update calls. Requests are
    scoped to a numeric projectId and authenticated with an X-Auth-Token
    (email:token) or an exchanged access token.
